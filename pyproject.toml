[project]
name = "minimaxh3-clipcached"
version = "1.0.0"
description = "Cached alternatives to ComfyUI's native MiniMax H3 FL2VA and Ref2VA conditioning nodes that avoid repeatedly loading the large Qwen3-VL text/vision encoder when the same H3 conditioning was already computed."
license = { file = "LICENSE" }
dependencies = ["safetensors"]
requires-python = ">=3.9"
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/Mu5hr00moO/ComfyUI-MiniMaxH3-CLIPCached"

[tool.comfy]
PublisherId = "mu5hr00moo"
DisplayName = "MiniMax H3 CLIP-Cached"
requires-comfyui = ">=0.30.0"
